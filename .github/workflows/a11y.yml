name: Accessibility Audit

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment

      - name: Run A11y Component Tests (Vitest)
        run: pnpm vitest run --reporter=default

      - name: Wait for server
        run: pnpm dev & npx wait-on http://localhost:3000

      - name: Playwright A11y Audit
        run: |
          npx playwright install --with-deps chromium
          pnpm exec playwright test --grep @a11y
